name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# CI token faqat o'qiy oladi (kod yozish, release, issue — yo'q)
permissions:
  contents: read

jobs:
  security:
    name: Secrets · Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repoda sir yo'qligi
        run: bash scripts/security/secret-scan.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Ishlab chiqarish bog'liqliklarida yuqori/kritik zaiflik yo'q
        run: npm audit --omit=dev --audit-level=high

  app:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key_for_ci_build
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: SQL migrations + RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ishuz_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: bash scripts/db-test.sh

  e2e:
    name: Browser E2E (izolyatsiyalangan lokal stend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_PG: postgres://postgres:postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: PostgREST 12.2.3 (nazorat yig'indisi bilan)
        run: |
          curl -fsSL -o /tmp/pgrst.tar.xz https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          echo "9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c  /tmp/pgrst.tar.xz" | sha256sum -c -
          tar -xJf /tmp/pgrst.tar.xz -C /tmp && sudo install /tmp/postgrest /usr/local/bin/postgrest
      - run: npx playwright install --with-deps chromium
      - name: Stend (toza baza + barcha migratsiyalar + build)
        run: bash e2e/stack/up.sh
      - name: Playwright
        run: npx playwright test -c e2e
      - name: Xato bo'lsa — hisobot, trace, skrinshot va loglar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            e2e/.stack/report
            e2e/.stack/results
            e2e/.stack/*.log
          # e2e/.stack — nuqta bilan boshlanadigan papka; v4 ularni standart holatda o'tkazib yuboradi
          include-hidden-files: true
          retention-days: 7
