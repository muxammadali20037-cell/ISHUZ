name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# CI token faqat o'qiy oladi (kod yozish, release, issue — yo'q)
permissions:
  contents: read

jobs:
  security:
    name: Secrets · Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repoda sir yo'qligi
        run: bash scripts/security/secret-scan.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Ishlab chiqarish bog'liqliklarida yuqori/kritik zaiflik yo'q
        run: npm audit --omit=dev --audit-level=high

  app:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key_for_ci_build
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: SQL migrations + RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ishuz_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: bash scripts/db-test.sh
